<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<title>管理後台</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="toasts" aria-live="polite" role="status"></div>
<div id="app"></div>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IC = {
  home: '<path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/>',
  post: '<path d="M5 4h14v12H9l-4 4z"/><path d="M9 8.5h6M9 11.5h4"/>',
  line: '<path d="M4 11.5a8 7 0 0 1 16 0 8 7 0 0 1-16 0z"/><path d="M8 18.5 6.5 21 11 19"/>',
  lead: '<path d="M8.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20a6 6 0 0 1 12 0M16 4.2a3.5 3.5 0 0 1 0 6.6M18 14.3A6 6 0 0 1 21.5 20"/>',
  gear: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  user: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>',
  chev: '<path d="m9 6 6 6-6 6"/>', back: '<path d="m15 6-6 6 6 6"/>', x: '<path d="M6 6l12 12M18 6 6 18"/>', plus: '<path d="M12 5v14M5 12h14"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/>',
  spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>',
  inbox: '<path d="M3 13h5l1.5 2.5h5L16 13h5"/><path d="M5.5 5h13L21 13v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5z"/>',
};
const svg = (n, c = '') => `<svg class="${c}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const chev = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';

/* ---------- state ---------- */
let me = null, TZ = 'Asia/Taipei', BRAND = '管理後台', dirty = false, suppress = false, curHash = location.hash;
const S = { postSeg: 'draft', leadStatus: '', leadFrom: '', helpOpen: 'start', cache: {} };
document.addEventListener('input', (e) => { if (e.target.closest?.('[data-form]')) dirty = true; });

/* ---------- helpers ---------- */
const fmt = (iso) => iso ? new Intl.DateTimeFormat('zh-TW', { timeZone: TZ, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso)) : '—';
const list = (v) => v.split(/[,，]/).map((x) => x.trim()).filter(Boolean);
function toast(msg, kind = '', undo) {
  const box = $('#toasts');
  for (const x of $$('.toast', box)) if (x.firstChild?.textContent === msg) x.hidden = true, x.className = 'hide'; // 相同訊息不重複堆疊
  while ($$('.toast', box).length >= 3) box.querySelector('.toast').className = 'hide';                        // 最多同時 3 則
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg;
  if (undo) { const b = document.createElement('button'); b.className = 'u'; b.textContent = undo.label; b.onclick = () => { undo.fn(); t.remove(); }; t.append(b); }
  $('#toasts').append(t); setTimeout(() => t.remove(), kind === 'bad' ? 6000 : 3200);
}
// 換頁時舊頁面的讀取結果作廢，避免覆蓋新頁面
let renderSeq = 0;
const STALE = 'stale-render';
async function api(method, path, body) {
  const seq = renderSeq;
  const r = await fetch('/api' + path, { method, headers: { 'content-type': 'application/json', 'x-requested-with': 'admin-ui' }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401 && path !== '/login' && path !== '/me') { me = null; render(); throw new Error('登入已過期，請重新登入'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || '操作失敗，請稍後再試');
  if (method === 'GET' && seq !== renderSeq) return new Promise(() => {}); // 已換頁：舊頁面不再繼續（不顯示、不覆蓋新頁面）
  return d;
}
/** 按鈕載入狀態 + 錯誤回饋；成功回傳結果，失敗回傳 undefined 並顯示 toast */
async function act(btn, fn, okMsg) {
  if (btn) { if (btn.getAttribute('aria-busy') === 'true') return; btn.setAttribute('aria-busy', 'true'); }
  try { const r = await fn(); if (okMsg) toast(okMsg, 'ok'); return r ?? true; }
  catch (e) { if (e.message !== STALE) toast(e.message, 'bad'); }
  finally { btn?.removeAttribute('aria-busy'); }
}
const markField = (el, bad) => { el.classList.toggle('err', !!bad); if (bad) { el.focus(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } };
function check(rules) { for (const [el, bad, msg] of rules) { markField(el, bad); if (bad) { toast(msg, 'bad'); return false; } } return true; }

/* ---------- ui builders ---------- */
const field = (id, label, ctrl, hint = '') => `<div class="f"><label for="${id}">${label}</label>${ctrl}${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
const input = (id, v = '', a = '') => `<input id="${id}" value="${esc(v)}" ${a}>`;
const area = (id, v = '', a = '') => `<textarea id="${id}" ${a}>${esc(v)}</textarea>`;
const sw = (id, on, label) => `<label class="switch"><input type="checkbox" role="switch" id="${id}" ${on ? 'checked' : ''} aria-label="${esc(label)}"><i></i></label>`;
const row = ({ act: a, title, sub, end = '', dot = '', go = true, id = '', cls = '' }) =>
  `<${go || a ? 'button' : 'div'} class="row ${go || a ? '' : 'static'} ${cls}" ${a ? `data-act="${a}"` : ''} ${id ? `data-id="${esc(id)}"` : ''}>${dot ? `<span class="dot ${dot}"></span>` : ''}<span class="main"><span class="ttl" style="display:block">${title}</span>${sub ? `<span class="sub" style="display:block">${sub}</span>` : ''}</span>${end || go ? `<span class="end">${end}${go && a ? chev : ''}</span>` : ''}</${go || a ? 'button' : 'div'}>`;
const sec = (label, right = '') => `<div class="sec-h"><span class="lbl">${label}</span>${right}</div>`;
const empty = (icon, title, desc, cta = '') => `<div class="empty">${svg(icon)}<b>${title}</b><div>${desc}</div>${cta}</div>`;
const skeleton = () => `<div class="page"><div class="sk" style="height:26px;width:46%"></div><div class="sk" style="height:64px"></div><div class="sk" style="height:140px"></div><div class="sk" style="height:96px"></div></div>`;
const errorState = (msg) => `<div class="page">${empty('help', '載入失敗', esc(msg), '<button class="btn sec" data-act="retry">重新載入</button>')}</div>`;

function sheet(title, html, mount) {
  const el = document.createElement('div'); el.className = 'sheet';
  el.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="ph"><h2>${esc(title)}</h2><button class="icon" data-close aria-label="關閉">${svg('x')}</button></div><div class="pb">${html}</div></div>`;
  const prev = document.activeElement;
  const close = () => { el.remove(); document.removeEventListener('keydown', onKey); prev?.focus?.(); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  el.onclick = (e) => { if (e.target === el || e.target.closest('[data-close]')) close(); };
  document.addEventListener('keydown', onKey); document.body.append(el);
  setTimeout(() => $('input:not([type=checkbox]),textarea,button.btn', el)?.focus({ preventScroll: true }), 30);
  mount?.(el, close); return close;
}
function confirmSheet(msg, okText = '確定', danger = true) {
  return new Promise((res) => {
    let done = false; const fin = (v) => { if (!done) { done = true; res(v); } };
    const close = sheet(msg, `<div class="actions" style="margin-top:8px"><button class="btn sec" data-v="0">取消</button><button class="btn ${danger ? 'dng' : ''}" data-v="1" style="${danger ? 'background:var(--bad-bg)' : ''}">${esc(okText)}</button></div>`, (el, c) => {
      el.addEventListener('click', (e) => { const v = e.target.closest('[data-v]')?.dataset.v; if (v !== undefined) { fin(v === '1'); c(); } });
      new MutationObserver(() => { if (!document.body.contains(el)) fin(false); }).observe(document.body, { childList: true });
    });
  });
}
async function leaveOk() { if (!dirty) return true; const ok = await confirmSheet('有尚未儲存的修改，確定要離開？', '離開不儲存'); if (ok) dirty = false; return ok; }

/* ---------- router ---------- */
const route = () => { const p = (location.hash || '#/').slice(2).split('/'); return { tab: p[0] || 'home', sub: p[1] || '', arg: p[2] || '' }; };
async function go(path) { if (!(await leaveOk())) return; if (location.hash === '#/' + path) render(); else location.hash = '#/' + path; }
window.addEventListener('hashchange', async () => {
  if (suppress) { suppress = false; return; }
  if (dirty && !(await confirmSheet('有尚未儲存的修改，確定要離開？', '離開不儲存'))) { suppress = true; location.hash = curHash; return; }
  dirty = false; curHash = location.hash; render();
});
const TABS = [['home', '首頁', 'home', 'admin'], ['posts', '貼文', 'post', 'admin'], ['line', 'LINE', 'line', 'admin'], ['leads', '留資', 'lead', 'staff'], ['settings', '設定', 'gear', 'admin'], ['account', '帳號', 'user', 'staff-only']];
// 留資為加購項目：未開通時不顯示「留資」分頁
// LINE 自動接待也屬於加購：未開通時不顯示「LINE」分頁（回覆交給官方帳號後台自己的自動回應）
const tabsFor = () => TABS.filter((t) => ((t[0] !== 'leads' && t[0] !== 'line') || me.leads_enabled) && (me.role === 'admin' ? t[3] !== 'staff-only' : (t[3] === 'staff' || t[3] === 'staff-only')));

function bar({ title, back, right = '', sub = '', dot = '' }) {
  $('#bar').innerHTML = `<div class="in">${back ? `<button class="icon" data-act="back" data-to="${esc(back)}" aria-label="返回">${svg('back')}</button>` : ''}<div class="ttl" style="${back ? '' : 'padding:6px 0'}">${dot ? `<span class="dot ${dot}"></span>` : ''}<div><h1>${esc(title)}</h1>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div></div>${right}<button class="icon" data-act="help" aria-label="說明">${svg('help')}</button></div>`;
  document.title = title + ' · ' + BRAND;
}
const setView = (html, cls = '') => { $('#view').innerHTML = `<div class="page ${cls}">${html}</div>`; };

async function render() {
  dirty = false; curHash = location.hash;
  if (!me) { try { me = await api('GET', '/me'); } catch { me = null; } }
  if (!me) return loginView();
  const r = route(), tabs = tabsFor();
  const ok = r.tab === 'help' || r.tab === 'setup' || (r.tab === 'report' && me.role === 'admin') || (r.tab === 'settings' && r.sub === 'password') || tabs.some((t) => t[0] === r.tab);
  if (!ok) { suppress = true; location.hash = '#/' + tabs[0][0]; return render(); }
  if (!$('#view')) {
    $('#app').innerHTML = `<header class="bar" id="bar"></header><main id="view"></main><nav class="tabs" aria-label="主選單"><div class="in" id="tabs"></div></nav>`;
  }
  $('#tabs').innerHTML = `<div class="brand"><span class="mark" style="width:28px;height:28px;margin:0;font-size:14px" id="bm">${esc(BRAND[0])}</span><span class="clip">${esc(BRAND)}</span></div>` +
    tabs.map((t) => `<button class="tab" data-tab="${t[0]}" ${t[0] === r.tab ? 'aria-current="page"' : ''}>${svg(t[2])}<span>${t[1]}</span><span class="badge hide" data-badge="${t[0]}"></span></button>`).join('');
  $('#view').innerHTML = skeleton();
  const my = ++renderSeq;
  try { await PAGES[r.tab]?.(r); } catch (e) { if (e.message === STALE || my !== renderSeq) return; $('#view').innerHTML = errorState(e.message); }
  if (my !== renderSeq) return;
  window.scrollTo(0, 0); refreshBadges();
}
async function refreshBadges() {
  try {
    let d = 0, l = 0;
    if (me.role === 'admin') { const x = await api('GET', '/dashboard'); d = x.pending_drafts; l = x.inquiries_pending; }
    else l = (await api('GET', '/inquiries?status=pending')).length;
    for (const [k, n] of [['posts', d], ['leads', l]]) { const b = $(`[data-badge="${k}"]`); if (b) { b.textContent = n > 99 ? '99+' : n; b.classList.toggle('hide', !n); } }
  } catch { /* 徽章為次要資訊，失敗不打擾 */ }
}

/* ---------- global click delegation ---------- */
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-tab],[data-act],[data-go]'); if (!t) return;
  if (t.dataset.tab) return go(t.dataset.tab);
  if (t.dataset.go) return go(t.dataset.go);
  const a = t.dataset.act;
  if (a === 'back') return go(t.dataset.to);
  if (a === 'help') return go('help');
  if (a === 'retry') return render();
});

/* ---------- login ---------- */
function loginView() {
  $('#app').innerHTML = `<div class="login"><div class="mark" id="lg">營</div><h1 class="t-page" id="lt">管理後台</h1><p class="t-sub" style="margin:6px 0 24px">請使用管理員提供的帳號</p>
  ${field('u', '帳號', input('u', '', 'autocomplete="username" autocapitalize="none" autocorrect="off"'))}${field('p', '密碼', input('p', '', 'type="password" autocomplete="current-password"'))}
  <button class="btn block" id="go" style="margin-top:24px">登入</button>
  <p class="t-sub" style="margin-top:20px;text-align:center"><a href="/ops.html" style="color:inherit">服務商營運人員請由此登入</a></p></div>`;
  // 單一企業部署時，登入頁顯示該企業名稱；共用架構不知道是誰，維持通用標題
  fetch('/api/public').then((r) => r.json()).then((d) => {
    if (d.name) { BRAND = d.name; $('#lg').textContent = d.name[0]; $('#lt').textContent = d.name; }
  }).catch(() => {});
  const go = (b) => act(b, async () => {
    await api('POST', '/login', { username: $('#u').value.trim(), password: $('#p').value });
    me = null; $('#app').innerHTML = ''; await render();
  });
  $('#go').onclick = (e) => go(e.currentTarget); $('#p').onkeydown = (e) => { if (e.key === 'Enter') go($('#go')); }; // 不可回傳 false，否則會擋掉輸入
}

/* ======================================================================
   首頁：現在需要處理什麼 → 今日摘要 → 快速操作 → 自動化 → 最近活動
   ====================================================================== */
const ACTION = { account_update: '更新 Threads 帳號設定', account_disconnect: '中斷 Threads 帳號', user_password_reset: '重設同事密碼', user_update: '更新帳號', post_unschedule: '取消排程', post_reschedule: '調整發布時間', post_distribute: '改寫分發', data_export: '匯出資料', integration_line_webhook: '設定 LINE 自動接待', line_token_renewed: 'LINE 憑證自動更新', settings_update: '更新設定', post_approve: '核准貼文', post_generate: 'AI 生成貼文', post_edit: '編輯貼文', post_delete: '刪除貼文', post_retry: '重試發布', inquiry_status: '更新留資狀態', inquiry_delete: '刪除留資', line_config_update: '更新 LINE 接待設定', faq_create: '新增 FAQ', faq_update: '更新 FAQ', faq_delete: '刪除 FAQ', toggle: '切換自動化', integration_line: '設定 LINE 連線', integration_gemini: '設定 AI 連線', threads_connected: '連結 Threads', threads_disconnect: '中斷 Threads', threads_token_refreshed: 'Threads 授權自動續期', threads_deauthorize: 'Threads 解除授權', threads_delete: 'Threads 資料刪除', user_create: '新增帳號', user_update: '更新帳號', password_change: '變更密碼' };
const rel = (iso) => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? '剛剛' : m < 60 ? `${m} 分鐘前` : m < 1440 ? `${Math.floor(m / 60)} 小時前` : fmt(iso); };

async function getSetup() {
  const [ig, st] = await Promise.all([api('GET', '/integrations'), api('GET', '/settings')]);
  TZ = st.brand.timezone; BRAND = st.brand.name;
  const s = st.settings, steps = [
    { id: 'brand', t: '填寫品牌資料', d: '品牌介紹與服務內容，AI 會依此撰寫貼文', ok: !!(st.brand.description && s.services && !s.services.startsWith('（')), to: 'settings/brand', help: 'start' },
    { id: 'line', t: '填入 LINE 官方帳號 ID', d: '貼文結尾的加好友連結會用它', ok: !!s.line_add_url, to: 'settings/line', help: 'line' },
    { id: 'gemini', t: '連接 AI（Gemini）', d: '貼上 API key', ok: ig.gemini.configured, to: 'settings/gemini', help: 'gemini' },
    { id: 'threads', t: '連結 Threads 帳號', d: '授權後即可自動發文', ok: ig.threads.configured, to: 'settings/threads', help: 'threads' },
    ...(me.leads_enabled ? [{ id: 'linecontent', t: '編輯 LINE 服務說明', d: '顧客點「了解服務」時看到的內容', ok: !!s.line_ready, to: 'line/content', help: 'start' }] : []),
  ];
  return { ig, st, steps, done: steps.filter((x) => x.ok).length };
}

async function homePage() {
  const [d, setup, posts, audit, fn] = await Promise.all([api('GET', '/dashboard'), getSetup(), api('GET', '/posts'), api('GET', '/audit'), api('GET', '/funnel').catch(() => null)]);
  const qs = new URLSearchParams(location.search);
  if (qs.get('threads')) { qs.get('threads') === 'connected' ? toast('Threads 已連結成功', 'ok') : toast('Threads 連結失敗：' + (qs.get('reason') || '請重試'), 'bad'); history.replaceState(null, '', '/'); }
  const failed = posts.filter((p) => p.status === 'failed' || p.status === 'gen_failed').length, unknown = posts.filter((p) => p.status === 'unknown').length;
  const next = posts.filter((p) => p.status === 'scheduled' && p.scheduled_at && new Date(p.scheduled_at) > new Date()).sort((a, b) => a.scheduled_at.localeCompare(b.scheduled_at))[0];
  const todo = [];
  if (d.threads_status === 'token_invalid') todo.push({ dot: 'bad', t: 'Threads 授權已失效', s: '自動發文已暫停，請重新連結', to: 'settings/threads' });
  if (failed) todo.push({ dot: 'bad', t: `${failed} 則貼文處理失敗`, s: '查看原因並重試', to: 'posts', seg: 'hist' });
  if (unknown) todo.push({ dot: 'warn', t: `${unknown} 則貼文狀態待核對`, s: '系統正在向 Threads 確認，通常幾分鐘內自動完成', to: 'posts', seg: 'queue' });
  if (d.pending_drafts) todo.push({ dot: 'gold', t: `${d.pending_drafts} 則草稿待審核`, s: '核准後才會依排程發布', to: 'posts', seg: 'draft' });
  if (d.leads_enabled && d.inquiries_pending) todo.push({ dot: 'gold', t: `${d.inquiries_pending} 筆留資尚未處理`, s: '聯絡顧客後標記為已處理', to: 'leads', lead: 'pending' });
  const pct = d.gen_limit ? d.gen_today / d.gen_limit : 0;
  if (pct >= 1) todo.push({ dot: 'warn', t: '今日 AI 生成額度已用完', s: '明天自動恢復；既有草稿不受影響', to: 'posts' });
  else if (pct >= 0.8) todo.push({ dot: 'warn', t: `今日 AI 額度即將用完（${d.gen_today}/${d.gen_limit}）`, s: '', to: 'posts' });
  bar({ title: BRAND, dot: d.healthy ? 'ok' : 'bad', sub: d.healthy ? '' : '需要處理' });
  const m = (n, l, bad) => `<div><b class="${n === 0 || n === null ? 'z' : bad ? 'bad' : ''}">${n ?? '—'}</b><span>${l}</span></div>`;
  setView(`
    ${setup.done < setup.steps.length ? (() => { const nx = setup.steps.find((x) => !x.ok); return `<div class="banner"><div class="main"><div class="t-label">開通進度 ${setup.done}/${setup.steps.length}</div><div class="t-sub">下一步：${esc(nx.t)}</div></div><button class="btn sm" data-go="setup">繼續設定</button></div>`; })() : ''}
    <section>${sec('今日')}
      <div class="metrics">${m(d.posted_today, '已發文')}${m(d.pending_drafts, '待審核')}${d.leads_enabled ? m(d.inquiries_today, '新留資') + m(d.inquiries_pending, '未處理') : m(d.clicks_today, 'LINE 點擊') + m(d.line_data ? d.friends_yesterday : null, '昨日新好友')}</div>
      <p class="t-sub" style="margin-top:10px">${d.auto_post_enabled ? (next ? `下一則排程：${fmt(next.scheduled_at)}` : '自動發文運作中，目前沒有排程中的貼文') : '自動發文已暫停'}</p></section>
    ${fn ? funnelBlock(fn, '導流成效・近 30 天', true) : ''}
    <section>${sec('需要處理')}${todo.length ? `<div class="list">${todo.map((x, i) => row({ act: 'todo', id: String(i), dot: x.dot, title: x.t, sub: esc(x.s) })).join('')}</div>` : `<p class="t-sub">目前沒有需要處理的事項。</p>`}</section>
    <section class="actions"><button class="btn" data-act="gen">${svg('spark')}AI 生成貼文</button>${d.leads_enabled ? '<button class="btn sec" data-go="leads">查看留資</button>' : '<button class="btn sec" data-go="report">成效報告</button>'}</section>

const WD = '日一二三四五六';
function tzParts(ms) {

const fmtW = (ms) => { const p = tzParts(ms), wd = WD[new Date(Date.UTC(+p.year, +p.month - 1, +p.day)).getUTCDay()]; return `${+p.month}/${+p.day}（${wd}）${p.hour}:${p.minute}`; };

function timePicker(host, initMs, onDone, onCancel) {
  const now = tzParts(Date.now()), base = Date.UTC(+now.year, +now.month - 1, +now.day);

  const col = (k, items, cls, label) => `<div class="wheel ${cls}" data-w="${k}" tabindex="0" role="listbox" aria-label="${label}"><div class="pad"></div>${items.map((t, i) => `<div class="it" data-i="${i}" role="option">${t}</div>`).join('')}<div class="pad"></div></div>`;
  host.innerHTML = `<div class="wheels">${col('d', days.map((x) => x.label), 'day', '日期')}${col('h', hours, '', '時')}${col('m', mins, '', '分')}</div>
    <p class="t-sub" id="tpv" style="margin:10px 2px 0"></p><div class="actions" style="margin-top:12px"><button class="btn sec" data-tp="0">取消</button><button class="btn" data-tp="1">確定</button></div>`;
  const ms = () => { const d = days[sel.d]; return zonedMs(d.y, d.m, d.d, sel.h, sel.m * 5); };
  const show = () => {
    for (const w of host.querySelectorAll('.wheel')) w.querySelectorAll('.it').forEach((it) => it.classList.toggle('on', +it.dataset.i === sel[w.dataset.w]));
    const t = ms(), past = t < Date.now() - 60000;
    $('#tpv', host).textContent = past ? '這個時間已經過去，請選擇之後的時間' : `將於 ${fmtW(t)} 發布`;
    $('#tpv', host).style.color = past ? 'var(--bad)' : ''; $('[data-tp="1"]', host).disabled = past;
  };
  host.querySelectorAll('.wheel').forEach((w) => {
    const k = w.dataset.w, max = w.querySelectorAll('.it').length - 1; let tm;
    requestAnimationFrame(() => { w.scrollTop = sel[k] * 40; });

const oaUrl = (id, path = '') => `https://manager.line.biz/account/@${String(id).replace(/[^a-z0-9._-]/gi, '')}${path}`; // 官方帳號 ID 只含英數與 ._-
const normBasicId = (v) => { const x = String(v || '').trim().replace(/^https?:\/\/[^@]*/, '').replace(/\s+/g, ''); return x ? (x.startsWith('@') ? x : '@' + x).toLowerCase() : ''; };
/** 從 LINE Developers「Basic settings」整頁複製的文字中找出 Channel ID 與 Channel secret */
function parseLineCreds(text) {
  const t = String(text || '');
  const id = (t.match(/Channel\s*ID[^\d]{0,20}(\d{8,12})/i) || t.match(/(?:^|[^0-9A-Za-z])([12]\d{9})(?![0-9A-Za-z])/) || [])[1] || '';
  const secret = (t.match(/Channel\s*secret[^0-9a-f]{0,20}([0-9a-f]{32})(?![0-9a-z])/i) || t.match(/(?:^|[^0-9a-z])([0-9a-f]{32})(?![0-9a-z])/i) || [])[1] || '';
  return { id, secret };
}
