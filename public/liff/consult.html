<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f3ee">
<title>線上顧問諮詢｜異構資本 EGO®</title>
<style>
  /* 與電子書書櫃同一套配色：米白底、磚紅點綴、深墨字 */
  :root { --bg: #f6f3ee; --card: #fffdf9; --ink: #1d1b18; --ink2: #6b655c; --ink3: #a39c91; --red: #d9483b; --red-soft: #f9e4df; --line: #e8e2d8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; -webkit-font-smoothing: antialiased; line-height: 1.5; }
  button, textarea { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 18px 20px calc(104px + env(safe-area-inset-bottom)); }
  .loading { padding-top: 40vh; text-align: center; color: var(--ink3); font-size: 14px; }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .18em; color: var(--red); }
  .time { font-size: 12px; color: var(--ink3); }
  .rule { height: 3px; width: 28px; background: var(--red); border-radius: 2px; margin: 14px 0 12px; }
  .hi { font-size: 15px; color: var(--ink2); min-height: 22px; }
  h1 { font-size: 24px; line-height: 1.3; font-weight: 800; letter-spacing: -.01em; margin-top: 4px; }
  .lead { font-size: 14px; color: var(--ink2); margin-top: 8px; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .pills span { font-size: 12px; color: var(--ink2); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }

  .q { margin-top: 26px; }
  .qh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .qh b { flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--red); color: #fff; font-size: 12px; }
  .qh h2 { font-size: 16px; font-weight: 700; }
  .qh em { font-style: normal; font-size: 12px; color: var(--ink3); font-weight: 400; margin-left: 4px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .opt { display: flex; width: 100%; align-items: center; gap: 12px; text-align: left; background: none; border: 0; padding: 14px 16px; font-size: 15px; cursor: pointer; }
  .opt + .opt { border-top: 1px solid var(--line); }
  .opt .box { flex: none; width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid #cfc7ba; display: grid; place-items: center; transition: all .12s ease; }
  .opt .box svg { width: 13px; height: 13px; opacity: 0; transition: opacity .12s ease; }
  .opt[aria-pressed="true"] { background: #fff8f6; }
  .opt[aria-pressed="true"] .box { background: var(--red); border-color: var(--red); }
  .opt[aria-pressed="true"] .box svg { opacity: 1; }
  .opt .lbl { flex: 1; }
  .opt.muted .lbl { color: var(--ink2); }

  textarea { width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 14px 16px; font-size: 15px; line-height: 1.55; outline: none; transition: border-color .12s ease, box-shadow .12s ease; }
  textarea::placeholder { color: var(--ink3); }
  textarea:focus { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }

  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg button { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 6px; font-size: 14px; cursor: pointer; transition: all .12s ease; }
  .seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }

  .shake { animation: shake .28s ease; }
  .warn { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 18px; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 20px calc(10px + env(safe-area-inset-bottom)); background: rgba(246,243,238,.94); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
  .dock .in { max-width: 480px; margin: 0 auto; }
  .send { width: 100%; height: 52px; border: 0; border-radius: 14px; background: var(--ink); color: #fff; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 20px -10px rgba(0,0,0,.5); cursor: pointer; }
  .send span { color: #ffb4a8; }
  .send:disabled { opacity: .6; }
  .safe { text-align: center; font-size: 11.5px; color: var(--ink3); margin-top: 7px; }

  .done { padding-top: 26vh; text-align: center; }
  .done .ok { width: 64px; height: 64px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; margin: 0 auto 18px; font-size: 30px; }
  .done p { color: var(--ink2); font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
<main class="wrap" id="app"><p class="loading">載入中…</p></main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<script>
'use strict';
// 顧問諮詢需求確認：不收集個資，只把顧客的選擇整理成一則訊息，送到官方帳號聊天室，由顧問直接回覆。
// 在 LINE 內（LIFF）直接代顧客送出並關閉頁面；不在 LINE 內時改用「開啟聊天室並帶入文字」的連結。
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
let cfg, inLiff = false, name = '';
const picked = { lines: new Set(), stage: '' };

function render() {
  const last = cfg.lines.length - 1;
  $('#app').innerHTML = `<div class="top"><span class="eyebrow">EGO® 顧問諮詢</span><span class="time">約 30 秒</span></div>
    <div class="rule"></div>
    <p class="hi">${name ? `嗨，${esc(name)} 👋` : ''}</p>
    <h1>${esc(cfg.title)}</h1>
    <p class="lead">告訴我們你的狀況，顧問會直接在聊天室回覆你。</p>
    <div class="pills"><span>不用留電話</span><span>不用留 Email</span><span>免費</span></div>

    <section class="q"><div class="qh"><b>1</b><h2>你想了解哪個方向？<em>可複選</em></h2></div>
      <div class="card" id="ql">${cfg.lines.map((l, i) => `<button type="button" class="opt${i === last ? ' muted' : ''}" data-l="${i}" aria-pressed="false"><span class="box">${CHECK}</span><span class="lbl">${esc(l)}</span></button>`).join('')}</div>
      <p class="warn" id="qlw"></p></section>

    <section class="q"><div class="qh"><b>2</b><h2>目前最想解決的問題？<em>選填</em></h2></div>
      <textarea id="qp" maxlength="300" placeholder="例如：沒時間經營社群、詢問很多但成交少…"></textarea></section>

    <section class="q"><div class="qh"><b>3</b><h2>希望多快開始？</h2></div>
      <div class="seg" id="qs">${cfg.stages.map((s, i) => `<button type="button" data-s="${i}" aria-pressed="false">${esc(s)}</button>`).join('')}</div></section>

    <div class="dock"><div class="in"><button class="send" id="go">送出，請顧問回覆我 <span>→</span></button><p class="safe">送出後會出現在聊天室，顧問看到就回覆你</p></div></div>`;
  $$('#ql [data-l]').forEach((b) => b.onclick = () => {
    const v = cfg.lines[+b.dataset.l]; picked.lines.has(v) ? picked.lines.delete(v) : picked.lines.add(v);
    b.setAttribute('aria-pressed', picked.lines.has(v)); if (picked.lines.size) $('#qlw').textContent = '';
  });
  $$('#qs [data-s]').forEach((b) => b.onclick = () => { picked.stage = cfg.stages[+b.dataset.s]; $$('#qs [data-s]').forEach((x) => x.setAttribute('aria-pressed', x === b)); });
  $('#go').onclick = send;
}

function message() {
  const p = $('#qp').value.trim();
  return ['【顧問諮詢需求】', `想了解：${[...picked.lines].join('、') || '還不確定'}`, p ? `想解決：${p}` : '', `時程：${picked.stage || '未選'}`].filter(Boolean).join('\n');
}

async function send() {
  if (!picked.lines.size) {
    const box = $('#ql'); box.scrollIntoView({ block: 'center', behavior: 'smooth' });
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); $('#qlw').textContent = '請至少選一個方向';
    return;
  }
  const text = message(), btn = $('#go'); btn.disabled = true;
  if (inLiff) {
    try {
      await liff.sendMessages([{ type: 'text', text }]);
      $('#app').innerHTML = '<div class="done"><div class="ok">✓</div><h1>已送出</h1><p>顧問會在聊天室回覆你。</p></div>';
      setTimeout(() => liff.closeWindow(), 1200); return;
    } catch { /* 沒有送訊息權限時改用下面的連結 */ }
  }
  location.href = `https://line.me/R/oaMessage/${encodeURIComponent(cfg.oa)}/?${encodeURIComponent(text)}`;
}

(async () => {
  try { cfg = await (await fetch('/liff/consult.json', { cache: 'no-store' })).json(); }
  catch { $('#app').innerHTML = '<p class="loading">載入失敗，請重新開啟。</p>'; return; }
  if (cfg.liffId && window.liff) {
    try { await liff.init({ liffId: cfg.liffId }); inLiff = liff.isInClient(); } catch { inLiff = false; }
  }
  if (new URLSearchParams(location.search).has('liff.state')) return; // 要轉去子路徑（例如 /books），交給 LIFF 處理
  if (inLiff) { try { name = (await liff.getProfile()).displayName || ''; } catch { /* 沒有 profile 權限就不打招呼 */ } }
  render();
})();
</script>
</body>
</html>
