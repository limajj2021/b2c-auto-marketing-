<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>免費電子書｜異構資本 EGO®</title>
<style>
  /* 與電子書封面同一套配色：米白底、磚紅點綴、深墨字 */
  :root { --bg: #f6f3ee; --card: #fffdf9; --ink: #1d1b18; --ink2: #6b655c; --ink3: #a39c91; --red: #d9483b; --red-soft: #f9e4df; --line: #e8e2d8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; -webkit-font-smoothing: antialiased; line-height: 1.5; }
  a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 18px 20px calc(96px + env(safe-area-inset-bottom)); }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .18em; color: var(--red); }
  .count { font-size: 12px; color: var(--ink3); }
  .rule { height: 3px; width: 28px; background: var(--red); border-radius: 2px; margin: 14px 0 12px; }
  .hi { font-size: 15px; color: var(--ink2); min-height: 22px; }
  h1 { font-size: 24px; line-height: 1.3; font-weight: 800; letter-spacing: -.01em; margin-top: 4px; }
  .lead { font-size: 14px; color: var(--ink2); margin-top: 10px; }

  .steps { display: flex; align-items: center; gap: 6px; margin: 14px 0 4px; font-size: 12px; color: var(--ink2); }
  .steps b { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--red-soft); color: var(--red); font-size: 11px; margin-right: 4px; }
  .steps i { flex: 1; height: 1px; background: var(--line); font-style: normal; max-width: 22px; }

  .list { margin-top: 12px; display: grid; gap: 10px; }
  .book { display: flex; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px 10px 10px; transition: transform .12s ease, box-shadow .12s ease; }
  .book:active { transform: scale(.985); box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .cover { flex: none; width: 64px; aspect-ratio: 1 / 1.414; border-radius: 4px 7px 7px 4px; overflow: hidden; background: #efe9df;
           box-shadow: 0 1px 1px rgba(0,0,0,.06), 0 6px 14px -6px rgba(60,40,20,.35); position: relative; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: linear-gradient(90deg, rgba(0,0,0,.12), transparent); }
  .meta { min-width: 0; flex: 1; }
  .no { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--red); }
  .ttl { font-size: 15px; font-weight: 700; line-height: 1.42; margin-top: 3px; }
  .sub { font-size: 12.5px; color: var(--ink2); margin-top: 4px; }
  .read { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--red); margin-top: 6px; }

  .note { font-size: 12px; color: var(--ink3); text-align: center; margin-top: 18px; }

  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 20px calc(10px + env(safe-area-inset-bottom)); background: rgba(246,243,238,.94); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
  .dock .in { max-width: 480px; margin: 0 auto; }
  .tired { font-size: 13px; color: var(--ink2); text-align: center; margin-top: 18px; }
  .cta { display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 14px; background: var(--ink); color: #fff; font-size: 15px; font-weight: 700; box-shadow: 0 8px 20px -10px rgba(0,0,0,.5); }
  .cta:active { transform: scale(.99); }
  .cta span { color: #ffb4a8; }
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><span class="eyebrow">EGO® 免費電子書</span><span class="count">共 3 本・免費</span></div>
  <div class="rule"></div>
  <p class="hi" id="hi"></p>

      <span class="cover"><img src="/liff/consult/covers/b1.jpg" alt="" width="64" height="90"></span>
      <span class="meta"><span class="no">NO.1</span><span class="ttl" style="display:block">12 個讓貼文帶客進 LINE 的開頭公式</span><span class="sub" style="display:block">附填空模板，照填就能發</span><span class="read">免費閱讀 →</span></span></a>

    <a class="book" href="https://drive.google.com/file/d/1zqJ2xA1DAVIhozDNlyjtQIDXDdSB5bfr/view" target="_blank" rel="noopener">
      <span class="cover"><img src="/liff/consult/covers/b2.jpg" alt="" width="64" height="90"></span>
      <span class="meta"><span class="no">NO.2</span><span class="ttl" style="display:block">客人最常問的 10 個問題，就是 10 篇貼文</span><span class="sub" style="display:block">你的內容素材一直都在</span><span class="read">免費閱讀 →</span></span></a>

    <a class="book" href="https://drive.google.com/file/d/1KSQ3_yeWjn2SigpIkEaiJ-UaRIXxiosf/view" target="_blank" rel="noopener">

  <p class="tired">看完覺得每天自己寫太累？交給機器人 ↓</p>

<div class="dock"><div class="in">
  <a class="cta" href="https://liff.line.me/2012662581-pydaDItZ">交給 Threads 零廣告獲客機器人 <span>→</span></a>
</div></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<script>
'use strict';
// LIFF 書櫃：在 LINE 裡用讀者的名字打招呼，電子書在 LINE 內建視窗打開，看完關掉就回到書櫃。不在 LINE 裡時是一般網頁，連結照常可用。
(async () => {
  if (!window.liff) return;
  try { await liff.init({ liffId: '2012662581-pydaDItZ' }); } catch { return; }
  if (!liff.isInClient()) return;
  try { const p = await liff.getProfile(); if (p && p.displayName) document.getElementById('hi').textContent = `嗨，${p.displayName} 👋`; } catch { /* 沒有 profile 權限就不打招呼 */ }
  document.querySelectorAll('a.book').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); liff.openWindow({ url: a.href, external: false }); }));
})();
</script>
</body>
</html>
